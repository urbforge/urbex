# Where the docs name the release of urbex they install or show: the one
# list scripts/docs-version.py checks (urbforge/urbex#112) and the release
# preparation bumps (urbforge/urbex-cli#156). One entry per line:
#
#   file <path>              a file to read, relative to the repository
#   match <regex>            a Python regex whose group 1 is the version;
#                            it applies to every file
#   match <path> <regex>     the same, only in that file
#   allow <path> <regex>     a line of that file matching it names an old
#                            version on purpose: left as it is
#
# A version is X.Y.Z with an optional pre-release suffix (-rc.1). The
# upgrading guide's headings, the skills' minimum urbex, the projects'
# own versions (v1.4.2, v0.1.0 for a first release), the ADRs and
# CHANGELOG.md mean other versions: they aren't listed, or are allowed.

file README.md
file docs/getting-started.md
file docs/getting-started/with-the-cli.md
file docs/cookbook.md
file docs/known-limitations.md
file docs/reference/cli.md
file docs/upgrading.md

# The release's pages and downloads, urbex-cli's and urbex's.
match github\.com/urbforge/urbex(?:-cli)?/releases/(?:tag|download)/v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)\b
match github\.com/urbforge/urbex(?:-cli)?/blob/v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)/
# The image, and what urbex-op and urbex print.
match ghcr\.io/urbforge/urbex-op:(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)\b
match \burbex-op (\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?), image
match (?:^|# )urbex (\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?) \(commit
match docs/reference/cli.md ^  "version": "(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)",$
# The binary's download without the container.
match ^v=(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?) os=
# The status line of the README and of the known limitations.
match README.md preview release \(\[v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)\]
match docs/known-limitations.md \bv(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)\b
# The upgrading guide's note on its example command.
match docs/upgrading.md \(`v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)` above is an\b

# The image of the release the reader moves away from.
allow docs/upgrading.md podman rmi ghcr\.io/urbforge/urbex-op:
